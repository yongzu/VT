<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0}html,body{background:transparent}svg{display:block}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="60 320 1800 680" width="1800" height="680" font-family="Pretendard, 'Pretendard Variable', sans-serif">
  <defs>
    <linearGradient id="lens" gradientUnits="userSpaceOnUse" x1="370" y1="0" x2="630" y2="0">
      <stop offset="0" stop-color="#2F6BF2"/>
      <stop offset=".5" stop-color="#8A5FB9"/>
      <stop offset="1" stop-color="#E5527F"/>
    </linearGradient>
    <linearGradient id="self" gradientUnits="userSpaceOnUse" x1="1360" y1="440" x2="1860" y2="940">
      <stop offset="0" stop-color="#2F6BF2"/>
      <stop offset=".5" stop-color="#8A5FB9"/>
      <stop offset="1" stop-color="#E5527F"/>
    </linearGradient>
    <linearGradient id="span" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="940" y2="0">
      <stop offset="0" stop-color="#2F6BF2"/>
      <stop offset="1" stop-color="#E5527F"/>
    </linearGradient>
    <clipPath id="union"><circle cx="310" cy="690" r="250"/><circle cx="690" cy="690" r="250"/></clipPath>
    <filter id="bleed" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- 머리말 -->
  <text x="500" y="352" font-size="22" font-weight="600" fill="#2F6BF2" text-anchor="middle" letter-spacing="-0.02em" >Connection</text>
  <text x="500" y="398" font-size="34" font-weight="700" fill="#333333" text-anchor="middle" letter-spacing="-0.02em" >서로의 세계</text>
  <text x="1610" y="352" font-size="22" font-weight="600" fill="#8A5FB9" text-anchor="middle" letter-spacing="-0.02em" >Trace</text>
  <text x="1610" y="398" font-size="34" font-weight="700" fill="#333333" text-anchor="middle" letter-spacing="-0.02em" >남겨진 흔적</text>

  <!-- 두 세계: 바깥 윤곽은 선명하게 남고(경계), 맞닿은 자리는 선 없이 번지며 새 색이 된다(스며듦).
       겹침보다 넓은 띠를 흐리게 깔아 두 원 사이의 윤곽선을 지운다 -->
  <circle cx="310" cy="690" r="250" fill="#2F6BF2"/>
  <circle cx="690" cy="690" r="250" fill="#E5527F"/>
  <g clip-path="url(#union)">
    <rect x="370" y="400" width="260" height="580" fill="url(#lens)" filter="url(#bleed)"/>
  </g>
  
  <text x="288" y="596" font-size="32" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >나의 세계</text>
  <line x1="188" y1="626" x2="388" y2="626" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="288" y="676" font-size="20" font-weight="400" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >나의 말투 · 취향 · 습관</text>
  <path d="M288 704V742M279 733L288 742L297 733" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="288" y="794" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >상대의 삶에</text>
  <text x="288" y="830" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >나의 일부를 남긴다</text>
  
  <text x="716" y="596" font-size="32" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >타인의 세계</text>
  <line x1="616" y1="626" x2="816" y2="626" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="716" y="676" font-size="20" font-weight="400" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >가족 · 친구 · 연인 · 지나간 인연</text>
  <path d="M716 704V742M707 733L716 742L725 733" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="716" y="794" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >상대의 일부를</text>
  <text x="716" y="830" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >나의 삶에 받아들인다</text>
  <text x="500" y="698" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >스며듦</text>

  <!-- 화살표 -->
  <path d="M1090 690H1210M1192 672L1210 690L1192 708" stroke="#8A5FB9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 결과: 두 색이 섞인 원 = 흔적이 모여 이룬 지금의 나 -->
  <circle cx="1610" cy="690" r="250" fill="url(#self)"/>
  <text x="1610" y="628" font-size="30" font-weight="400" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >서로에게 스며든 흔적이</text>
  <text x="1610" y="704" font-size="54" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >지금의 나를</text>
  <text x="1610" y="768" font-size="30" font-weight="400" fill="#fff" text-anchor="middle" letter-spacing="-0.02em" >이룬다</text>

  <!-- 범위 표시선 -->
  
  <line x1="60" y1="978" x2="940" y2="978" stroke="url(#span)" stroke-width="2"/>
  <path d="M60 971L71 978L60 985Z" fill="url(#span)"/>
  <path d="M940 971L929 978L940 985Z" fill="url(#span)"/>
  
  <line x1="1360" y1="978" x2="1860" y2="978" stroke="#8A5FB9" stroke-width="2"/>
  <path d="M1360 971L1371 978L1360 985Z" fill="#8A5FB9"/>
  <path d="M1860 971L1849 978L1860 985Z" fill="#8A5FB9"/>
</svg>
</body></html>
