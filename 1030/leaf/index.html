<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VT · 잎과 꽃</title>
<meta name="description" content="연결에 스며든 사랑 - 그래픽 개념 정리. 두 세계가 겹친 자리가 잎이 되고, 관계가 모여 한 송이 꽃이 된다">
<link rel="icon" type="image/png" href="../../assets/mark.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{color-scheme:light;--ink:#333;--text:#555;--muted:#777;--faint:#999;--rule:#ededed;--line:#dcdcdc}
*{box-sizing:border-box}
html{font-size:12pt;-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--text);font-family:"Pretendard Variable",Pretendard,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-underline-offset:3px;text-decoration-color:var(--line)}
.toolbar{display:flex;align-items:center;gap:20px;padding:18px 24px}
.toolbar img{display:block;height:27px;width:auto}
.toolbar .src{margin-left:auto;color:var(--muted);text-decoration:none;font-size:.92rem}
main{width:min(820px,calc(100% - 32px));margin:40px auto 140px}
.doc h1{margin:0 0 28px;color:var(--ink);font-size:1.7rem;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.doc h2{margin:64px 0 14px;padding-top:22px;border-top:1px solid var(--rule);color:var(--ink);font-size:1.2rem;font-weight:600}
.doc h3{margin:36px 0 10px;color:var(--ink);font-size:1.05rem;font-weight:600}
.doc p,.doc ul,.doc ol{margin:0 0 14px}
.doc ul,.doc ol{padding-left:1.3em}
.doc li{margin:4px 0}
.doc li>ul,.doc li>ol{margin:4px 0 0}
.doc strong{color:var(--ink);font-weight:600}
.doc blockquote{margin:0 0 18px;padding:14px 0 14px 18px;border-left:2px solid var(--ink);color:var(--ink);font-size:1.06rem}
.doc blockquote p{margin:0}
.doc blockquote p+p{margin-top:6px}
.doc code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:#f5f5f5;padding:1px 5px;border-radius:3px}
.table-wrap{overflow-x:auto;margin:6px 0 18px}
.doc table{width:100%;border-collapse:collapse;font-size:.95rem}
.doc th,.doc td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.doc th{color:var(--faint);font-weight:400;border-bottom-color:var(--line)}
.doc td{color:var(--ink)}
.doc input[type=checkbox]{margin:0 6px 0 0;accent-color:#555;vertical-align:-1px}
.doc li:has(>input[type=checkbox]){list-style:none;margin-left:-1.3em}
.status{color:var(--faint)}
.viz{margin:26px 0 8px;padding:20px;border:1px solid var(--rule);border-radius:6px}
.viz-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px}
.viz svg{display:block;width:100%;height:auto}
.viz .lbl{font-size:.88rem;color:var(--muted)}
.viz .row{display:flex;align-items:center;gap:10px;margin:8px 0}
.viz .row input[type=range]{flex:1;accent-color:#555}
.viz .checks label{display:inline-flex;align-items:center;gap:6px;margin-right:14px;cursor:pointer}
.viz input[type=checkbox]{accent-color:#555}
.viz .state{margin:10px 0 0;color:var(--ink);font-weight:600}
.viz .note{margin:2px 0 0}
.viz-cap{margin:8px 0 0;font-size:.88rem;color:var(--faint)}
footer{margin-top:72px;padding-top:20px;border-top:1px solid var(--rule);color:var(--faint);font-size:.9rem}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header class="toolbar">
<a href="../../" aria-label="VT 처음으로"><img src="../../assets/logo.png" alt="" width="58" height="27"></a>
<a class="src" href="https://github.com/yongzu/VT/blob/main/1030/leaf-concept.md">원문 leaf-concept.md ↗</a>
</header>
<main>
<article class="doc" id="doc"><p class="status">불러오는 중…</p></article>

<template id="viz-tpl">
<figure class="viz" aria-label="두 원이 겹친 자리가 잎이 되고, 여러 관계의 잎이 나의 윤곽을 그리는 인터랙션">
<div class="viz-cols">
<div>
<svg viewBox="0 0 330 260" role="img" aria-label="나의 원과 상대의 원이 겹친 자리에 생기는 잎">
<defs><clipPath id="clipMe"><circle cx="130" cy="125" r="80"/></clipPath></defs>
<circle id="o2" cx="210" cy="125" r="70" fill="#D85A30" fill-opacity="0.12" stroke="#D85A30" stroke-width="1"/>
<circle cx="130" cy="125" r="80" fill="#1D9E75" fill-opacity="0.12" stroke="#1D9E75" stroke-width="1"/>
<circle id="lens" cx="210" cy="125" r="70" clip-path="url(#clipMe)" fill="#7F77DD" fill-opacity="0.55"/>
<line id="chord" x1="0" y1="0" x2="0" y2="0" stroke="#333" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="70" y="240" text-anchor="middle" font-size="12" fill="#0F6E56">나</text>
<text id="otl" x="250" y="240" text-anchor="middle" font-size="12" fill="#993C1D">상대</text>
</svg>
<div class="row"><span class="lbl" style="min-width:56px">가까움</span><input type="range" id="dist" min="0" max="100" value="45" step="1" aria-label="가까움"></div>
<div class="row"><span class="lbl" style="min-width:56px">상대 크기</span><input type="range" id="size" min="30" max="110" value="70" step="1" aria-label="상대 크기"></div>
<p class="state" id="state" aria-live="polite"></p>
<p class="note lbl" id="state2"></p>
</div>
<div>
<svg viewBox="0 0 330 260" role="img" aria-label="나의 원 가장자리를 따라 놓인 관계의 잎들">
<defs><clipPath id="clipMe2"><circle cx="165" cy="125" r="82"/></clipPath></defs>
<g id="others"></g>
<g id="leaves" clip-path="url(#clipMe2)"></g>
<circle id="me2" cx="165" cy="125" r="82" fill="none" stroke="#777" stroke-width="1"/>
</svg>
<div class="row checks lbl"><label><input type="checkbox" id="showMe" checked> 나의 원</label><label><input type="checkbox" id="showOthers"> 상대의 원</label></div>
<div class="row checks lbl"><label><input type="checkbox" id="past"> 몇몇 관계가 지나감</label></div>
<p class="note lbl">나의 원을 끄면, 관계의 잎들만으로 나의 윤곽이 드러난다</p>
</div>
</div>
</figure>
<p class="viz-cap">직접 만져 보기: 왼쪽은 두 원의 가까움과 크기에 따라 달라지는 잎, 오른쪽은 여러 관계의 잎이 나의 원 가장자리에 놓이는 모습</p>
</template>

<footer>
<p>Visual Translation · 전시 포스터 「연결에 스며든 사랑」 · TEAM 04 Team SAI(이가은 · 임창균 · 조용주) · <a href="https://github.com/yongzu/VT/tree/main/1030">작업 기록 1030</a></p>
</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(async () => {
  const MD = '../leaf-concept.md';
  const REPO = 'https://github.com/yongzu/VT/blob/main/1030/';
  const doc = document.getElementById('doc');
  let text;
  try {
    const res = await fetch(MD, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    text = await res.text();
  } catch (e) {
    doc.innerHTML = `<p class="status">문서를 불러오지 못했다. <a href="${REPO}leaf-concept.md">GitHub에서 보기</a></p>`;
    return;
  }
  doc.innerHTML = marked.parse(text, { gfm: true });

  // 문서 기준(1030/)의 상대 경로를 이 페이지(1030/leaf/) 기준으로 바꾼다. 마크다운 파일은 GitHub에서 연다
  doc.querySelectorAll('a[href], img[src]').forEach((el) => {
    const attr = el.tagName === 'A' ? 'href' : 'src';
    const v = el.getAttribute(attr);
    if (!v || /^(https?:|mailto:|#)/.test(v)) return;
    if (v.startsWith('leaf/')) { el.setAttribute(attr, './' + v.slice(5).replace(/^index\.html$/, '')); return; }
    el.setAttribute(attr, /\.md(#|$)/.test(v) ? REPO + v : '../' + v);
  });
  doc.querySelectorAll('table').forEach((t) => {
    const w = document.createElement('div');
    w.className = 'table-wrap';
    t.replaceWith(w);
    w.appendChild(t);
  });
  doc.querySelectorAll('h2, h3').forEach((h) => {
    h.id = h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s+/g, '-');
  });

  // 시각 자료는 '1. 왜 잎인가' 절 끝(2절 제목 앞)에 넣는다
  const viz = document.getElementById('viz-tpl').content.cloneNode(true);
  const h2s = [...doc.querySelectorAll('h2')];
  const next = h2s.find((h) => /^2\./.test(h.textContent.trim()));
  if (next) next.before(viz); else doc.appendChild(viz);
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  initViz();
})();

function initViz() {
  const R1 = 80, CX = 130, CY = 125;
  const dist = document.getElementById('dist'), size = document.getElementById('size');
  function upd1() {
    const r2 = +size.value, maxD = R1 + r2 + 6, minD = Math.max(0, Math.abs(R1 - r2) - 6);
    const d = maxD - (maxD - minD) * (+dist.value / 100), ox = CX + d;
    ['o2', 'lens'].forEach((id) => { const e = document.getElementById(id); e.setAttribute('cx', ox); e.setAttribute('r', r2); });
    document.getElementById('otl').setAttribute('x', Math.min(300, ox + 20));
    const ch = document.getElementById('chord');
    let s = '', s2 = '';
    if (d >= R1 + r2) { s = '아직 만나지 않았다'; s2 = '겹친 자리가 없으니 잎도 없다'; ch.setAttribute('opacity', 0); }
    else if (d <= Math.abs(R1 - r2)) { s = '잎이 사라졌다'; s2 = '한쪽이 다른 쪽에 삼켜지면 겹침은 원 하나가 된다. 하나가 되는 건 사랑이 아니다'; ch.setAttribute('opacity', 0); }
    else {
      const a = (d * d + R1 * R1 - r2 * r2) / (2 * d), h = Math.sqrt(Math.max(0, R1 * R1 - a * a));
      ch.setAttribute('x1', CX + a); ch.setAttribute('x2', CX + a); ch.setAttribute('y1', CY - h); ch.setAttribute('y2', CY + h); ch.setAttribute('opacity', 1);
      const w = (R1 + r2 - d) / (2 * Math.min(R1, r2));
      s = w < 0.22 ? '스친 인연: 가는 잎' : w < 0.6 ? '자주 만나는 사이: 보통 잎' : '오래 함께한 사이: 둥근 잎';
      s2 = Math.abs(R1 - r2) > 25 ? '두 세계의 크기가 달라 잎의 양쪽 곡선이 다르다' : '잎의 한쪽 가장자리는 나, 다른 쪽은 상대가 그린다. 점선이 가운데 맥';
    }
    document.getElementById('state').textContent = s;
    document.getElementById('state2').textContent = s2;
  }
  dist.oninput = upd1; size.oninput = upd1; upd1();

  const people = [[20, 112, 48, '#D85A30', 0], [85, 118, 40, '#EF9F27', 1], [140, 104, 55, '#378ADD', 0], [200, 120, 34, '#639922', 1], [255, 108, 46, '#D4537E', 0], [315, 116, 38, '#BA7517', 0]];
  function upd2() {
    const past = document.getElementById('past').checked, so = document.getElementById('showOthers').checked;
    let L = '', O = '';
    people.forEach((p) => {
      const t = (p[0] * Math.PI) / 180, x = 165 + p[1] * Math.cos(t), y = 125 + p[1] * Math.sin(t);
      const gone = past && p[4];
      L += gone ? `<circle cx="${x}" cy="${y}" r="${p[2]}" fill="none" stroke="${p[3]}" stroke-width="1" stroke-dasharray="2 3"/>` : `<circle cx="${x}" cy="${y}" r="${p[2]}" fill="${p[3]}" fill-opacity="0.5"/>`;
      if (so && !gone) O += `<circle cx="${x}" cy="${y}" r="${p[2]}" fill="none" stroke="${p[3]}" stroke-width="0.6" stroke-opacity="0.6"/>`;
    });
    document.getElementById('leaves').innerHTML = L;
    document.getElementById('others').innerHTML = O;
    document.getElementById('me2').setAttribute('opacity', document.getElementById('showMe').checked ? 1 : 0);
  }
  ['showMe', 'showOthers', 'past'].forEach((id) => { document.getElementById(id).onchange = upd2; });
  upd2();
}
</script>
</body>
</html>
